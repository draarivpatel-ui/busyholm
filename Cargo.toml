[workspace]
resolver = "2"
members = [
    "contracts/rust",
    "collector",
    "collector-claude",
    "collector-wp06",
    "shim",
    "installer",
    "sidecar",
]
# collector-codex (WP-05) keeps its own workspace, lockfile and target folder; it is still a path dependency of sidecar.
exclude = ["collector-codex"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
busyholm-contracts = { path = "contracts/rust" }
