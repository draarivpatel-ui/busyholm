<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Busyholm ambient</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070d;
    cursor: none;
  }
  canvas {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: none;
  }
  #counts {
    position: fixed;
    right: 24px;
    bottom: 24px;
    padding: 10px 14px;
    border-radius: 10px;
    background: rgba(10, 14, 24, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: #e6eaf2;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    cursor: none;
  }
  #counts .big { font-size: 22px; font-weight: 600; }
  #nocore {
    position: fixed;
    left: 12px;
    top: 10px;
    color: #9aa3b5;
    font: 12px system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="counts" role="status" aria-live="polite">
  <div><span class="big" id="n-agents">0</span> <span id="l-agents">agents</span></div>
  <div><span class="big" id="n-need">0</span> need you</div>
</div>
<div id="nocore" hidden>no core connected (press any key to simulate exit)</div>
<script type="module" src="ambient.js"></script>
</body>
</html>
