<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Busyholm</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="ui.css">
</head>
<body class="popover">
<div id="nocore" class="nocore" hidden>no core connected: showing sample data</div>
<section class="pop" aria-label="Busyholm agents">
  <header>
    <h1 id="title">Busyholm</h1>
    <div id="need-count" class="need-count" role="status" aria-live="polite">No agents need you</div>
  </header>
  <ul id="agents" aria-label="Agents"></ul>
  <div id="limits-wrap" class="limits-wrap" hidden>
    <h2 id="limits-title">Limits</h2>
    <div id="limits" class="limits"></div>
  </div>
  <footer>
    <button type="button" id="btn-details">Open details</button>
    <button type="button" id="btn-settings">Settings</button>
    <button type="button" id="btn-ambient">Ambient scene</button>
  </footer>
</section>
<script type="module" src="popover.js"></script>
</body>
</html>
