[package]
name = "busyholm-collector-claude"
description = "Busyholm Claude Code adapter (WP-04): hook, status line, registry, transcript and process mappers producing AgentEvent v1."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "collector_claude"

[dependencies]
busyholm-contracts.workspace = true
busyholm-collector = { path = "../collector" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
