[package]
name = "collector-codex"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false
license = "MIT"

# Keep this package independent while the shared workspace is being built.
[workspace]

[dependencies]
collector = { package = "busyholm-collector", path = "../collector" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
notify = "=8.2.0"
# Not an exact pin: "=0.3.36" held every crate that needs a newer `time` (serde_with 3.24, plist 1.10, and through them
# darling, quick-xml, deranged) back in the app lockfile. The locks of this package and of the root workspace stay at 0.3.36.
time = { version = "0.3.36", features = ["parsing"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

