[package]
name = "busyholm-collector"
description = "Busyholm collector: receiver, watchers, state machine, usage store, ledger accrual (WP-03 to WP-06)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
busyholm-contracts.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
hmac = "=0.12.1"
getrandom = "=0.2.16"
tiny_http = { version = "=0.12.0", default-features = false }
chrono = { version = "=0.4.42", default-features = false, features = ["clock", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lib]
name = "collector"

[[bin]]
name = "collector"
path = "src/main.rs"
