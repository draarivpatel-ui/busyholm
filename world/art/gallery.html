<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Busyholm art kit: gallery</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", "Noto Sans", system-ui, sans-serif; }
  body.bare { background: var(--page); overflow: hidden; }
  body.bare header, body.bare main { display: none; }
  header { padding: 28px 24px 8px; }
  header h1 { margin: 0 0 4px; font: 600 26px/1.2 "Fraunces", "Iowan Old Style", Georgia, serif; }
  header p { margin: 0; color: var(--muted); max-width: 80ch; }
  main { padding: 0 24px 64px; }
  section { margin-top: 36px; }
  h2 { font: 600 19px/1.3 "Fraunces", "Iowan Old Style", Georgia, serif; margin: 0 0 6px; }
  h3 { font-size: 15px; margin: 22px 0 4px; }
  .blurb { color: var(--muted); max-width: 90ch; margin: 0 0 10px; }
  figure { margin: 0 0 14px; }
  figure canvas { display: block; border-radius: 4px; }
  figcaption { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .golden { background: var(--panel); padding: 2px 16px 10px; border-radius: 10px; margin-bottom: 18px; }
  section > canvas { display: block; max-width: none; }
  section { overflow-x: auto; }
</style>
</head>
<body>
<header>
  <h1>Busyholm: Papercut Holm art kit</h1>
  <p>Everything on this page is drawn in code from the token palette (WP-09). Open directly from disk; the bundle is build/gallery.js (rebuild with <code>npm run build</code>).</p>
</header>
<main></main>
<script src="build/gallery.js"></script>
</body>
</html>
